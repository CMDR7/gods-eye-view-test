name: Temporary GEV formatter artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-artifact:
    if: github.event.head_commit.message != 'style(web-core): apply repository Prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format main.js with repository Prettier
        run: npx prettier src/web-core/main.js --write
      - name: Commit repository formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-core/main.js
          git diff --cached --quiet && exit 0
          git commit -m 'style(web-core): apply repository Prettier formatting'
          git push
