name: GEV Web Core Pages

on:
  push:
    branches: [web-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-core-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web Core
        run: node scripts/web-core.mjs

      - name: Verify Pages entry point
        run: test -f dist-web-core/index.html

      - name: Upload Web Core artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-web-core

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: web-core-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
