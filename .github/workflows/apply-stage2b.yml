name: Apply Stage 2B Telemetry HUD

on:
  push:
    branches: [web-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/apply-stage2b.mjs
      - name: Verify patch
        run: |
          grep -n "function addTelemetryHud" src/web-core/main.js
          grep -n "addTelemetryHud();" src/web-core/main.js
          grep -n "layerId: layer.id" src/web-core/main.js
      - name: Commit and remove patch tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web-core/main.js
          git rm scripts/apply-stage2b.mjs .github/workflows/apply-stage2b.yml
          git commit -m "Add Stage 2B tactical telemetry HUD"
          git push
