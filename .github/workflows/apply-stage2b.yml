name: Apply Stage 2B Telemetry HUD

on:
  push:
    branches: [web-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Web Core telemetry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/web-core/main.js')
          text = path.read_text()

          if 'function addTelemetryHud()' not in text:
              marker = 'async function boot() {'
              if marker not in text:
                  raise SystemExit('Boot marker not found')

              telemetry = r'''function addTelemetryHud() {
  const hud = document.createElement('section');
  hud.className = 'telemetryHud';
  hud.setAttribute('aria-label', 'Camera telemetry');
  hud.innerHTML = ['LAT', 'LON', 'ALT', 'HDG', 'RNG']
    .map((label) => `<div class="telemetryReadout"><span>${label}</span><strong data-telemetry="${label}">—</strong></div>`)
    .join('');
  document.body.appendChild(hud);

  const style = document.createElement('style');
  style.textContent = `
    .telemetryHud {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(620px, calc(100vw - 24px));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(80, 210, 255, .2);
      border-radius: 8px;
      background: rgba(3, 9, 13, .64);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(130, 235, 255, .12);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      pointer-events: none;
      user-select: none;
    }
    .telemetryReadout {
      min-width: 0;
      padding: 5px 6px 4px;
      border: 1px solid rgba(100, 220, 255, .09);
      border-radius: 5px;
      background: rgba(0, 0, 0, .22);
      box-shadow: inset 0 1px 0 rgba(120, 230, 255, .07);
    }
    .telemetryReadout span {
      display: block;
      margin-bottom: 3px;
      font: 600 7px/1 'Orbitron', sans-serif;
      letter-spacing: .12em;
      color: #647b86;
    }
    .telemetryReadout strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 600 9px/1.1 'Orbitron', sans-serif;
      letter-spacing: .02em;
      color: #dffaff;
      text-shadow: 0 0 8px rgba(90, 220, 255, .18);
    }
    @media (max-width: 520px) {
      .telemetryHud {
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: calc(100vw - 16px);
        gap: 3px;
        padding: 4px;
      }
      .telemetryReadout {
        padding: 4px 4px 3px;
      }
      .telemetryReadout span {
        font-size: 6px;
      }
      .telemetryReadout strong {
        font-size: 7px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .telemetryHud { transition: none !important; }
    }
  `;
  document.head.appendChild(style);

  const fields = Object.fromEntries(
    ['LAT', 'LON', 'ALT', 'HDG', 'RNG'].map((key) => [key, hud.querySelector(`[data-telemetry="${key}"]`)]),
  );
  const formatTelemetry = (value, digits = 1) => Number.isFinite(value)
    ? value.toLocaleString(undefined, { maximumFractionDigits: digits })
    : '—';

  const update = () => {
    const camera = state.viewer?.camera;
    const scene = state.viewer?.scene;
    if (!camera || !scene) return;

    const cartographic = camera.positionCartographic;
    const lat = Cesium.Math.toDegrees(cartographic.latitude);
    const lon = Cesium.Math.toDegrees(cartographic.longitude);
    const heading = Cesium.Math.toDegrees(Cesium.Math.zeroToTwoPi(camera.heading));
    const altitude = cartographic.height;

    fields.LAT.textContent = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}`;
    fields.LON.textContent = `${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}`;
    fields.ALT.textContent = `${formatTelemetry(altitude, 0)} M`;
    fields.HDG.textContent = `${formatTelemetry(heading, 0)}°`;

    let range = Number.NaN;
    try {
      const center = new Cesium.Cartesian2(scene.canvas.clientWidth / 2, scene.canvas.clientHeight / 2);
      const ray = camera.getPickRay(center);
      const surface = ray ? scene.globe.pick(ray, scene) : undefined;
      if (surface) range = Cesium.Cartesian3.distance(camera.position, surface);
    } catch {
      range = Number.NaN;
    }
    fields.RNG.textContent = Number.isFinite(range)
      ? `${formatTelemetry(range / 1000, range >= 100000 ? 0 : 1)} KM`
      : '—';
  };

  let queued = false;
  const queueUpdate = () => {
    if (queued) return;
    queued = true;
    window.requestAnimationFrame(() => {
      queued = false;
      update();
    });
  };

  state.viewer.camera.changed.addEventListener(queueUpdate);
  state.viewer.camera.moveEnd.addEventListener(queueUpdate);
  state.viewer.scene.postRender.addEventListener(update);
  update();
}

'''
              text = text.replace(marker, telemetry + marker, 1)

          meta_marker = "  entity.gevMeta = {\n    type: metadata.type || layer.name,"
          if meta_marker in text and '    layerId: layer.id,' not in text:
              text = text.replace(meta_marker, "  entity.gevMeta = {\n    layerId: layer.id,\n    type: metadata.type || layer.name,", 1)

          boot_marker = "  state.viewer.scene.requestRender();\n\n  addLayer('aircraft'"
          if boot_marker not in text:
              raise SystemExit('Boot render marker not found')
          if '  addTelemetryHud();\n\n  addLayer(\'aircraft\'' not in text:
              text = text.replace(boot_marker, "  state.viewer.scene.requestRender();\n  addTelemetryHud();\n\n  addLayer('aircraft'", 1)

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -n "function addTelemetryHud" src/web-core/main.js
          grep -n "addTelemetryHud();" src/web-core/main.js
          grep -n "layerId: layer.id" src/web-core/main.js

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web-core/main.js
          git rm .github/workflows/apply-stage2b.yml
          git commit -m "Add Stage 2B tactical telemetry HUD"
          git push
