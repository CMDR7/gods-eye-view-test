<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>GOD'S EYE VIEW // WEB CORE</title>
</head>
<body>
  <div id="app">
    <div id="cesiumContainer"></div>
    <div id="hud">
      <div id="brand">GOD'S EYE // WEB CORE</div>
      <button id="menuToggle" class="menuToggle" type="button" aria-label="Open command panel" aria-controls="commandPanel" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div id="status" role="status">BOOTING…</div>
    </div>

    <div id="commandBackdrop" class="commandBackdrop" hidden></div>
    <aside id="commandPanel" class="commandPanel" hidden aria-labelledby="commandTitle">
      <div class="commandHeader">
        <div>
          <div id="commandTitle" class="commandTitle">COMMAND // WEB CORE</div>
          <div class="commandSubtitle">NAVIGATION &amp; INTELLIGENCE LAYERS</div>
        </div>
        <button id="commandClose" class="panelClose" type="button" aria-label="Close command panel">×</button>
      </div>

      <div id="controls" class="controlStack" aria-label="Layer controls">
        <button id="home" type="button">HOME</button>
        <button id="locate" type="button">MY LOCATION</button>
        <button data-layer="aircraft" type="button">AIRCRAFT</button>
        <button data-layer="satellites" type="button">SATELLITES</button>
        <button data-layer="earthquakes" type="button">EARTHQUAKES</button>
        <button id="ionSettings" type="button">CESIUM ION</button>
        <button id="ionTerrain" type="button" disabled>ION TERRAIN</button>
      </div>
    </aside>

    <section id="ionPanel" class="panel" hidden aria-labelledby="ionTitle">
      <div class="panelHeader">
        <div id="ionTitle">CESIUM ION // USER TOKEN</div>
        <button id="ionClose" class="panelClose" type="button" aria-label="Close">×</button>
      </div>
      <p id="ionDescription" class="panelText">Enter your own Cesium Ion access token. The token is used directly by this browser and is never sent to a GEV server.</p>
      <label class="fieldLabel" for="ionToken">ACCESS TOKEN</label>
      <input id="ionToken" class="tokenInput" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Paste Cesium Ion token" />
      <label class="rememberRow">
        <input id="ionRemember" type="checkbox" checked />
        <span>Remember on this device</span>
      </label>
      <div class="panelActions">
        <button id="ionConnect" type="button">CONNECT</button>
        <button id="ionClear" type="button">CLEAR</button>
      </div>
      <div id="ionState" class="panelState" role="status">NO USER TOKEN CONFIGURED</div>
    </section>
  </div>
  <script type="module" src="/src/web-core/main.js"></script>
</body>
</html>
