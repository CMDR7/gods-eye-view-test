<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>GOD'S EYE VIEW // WEB CORE</title>
</head>
<body>
  <div id="app">
    <div id="cesiumContainer"></div>
    <div id="hud">
      <div id="brand">GOD'S EYE // WEB CORE</div>
      <div id="controls" aria-label="Layer controls">
        <button id="home" type="button">HOME</button>
        <button id="locate" type="button">MY LOCATION</button>
        <button data-layer="aircraft" type="button">AIRCRAFT</button>
        <button data-layer="satellites" type="button">SATELLITES</button>
        <button data-layer="earthquakes" type="button">EARTHQUAKES</button>
        <button id="ionSettings" type="button">CESIUM ION</button>
      </div>
      <div id="status" role="status">BOOTING…</div>
    </div>

    <section id="ionPanel" class="panel" hidden aria-labelledby="ionTitle">
      <div class="panelHeader">
        <div id="ionTitle">CESIUM ION // USER TOKEN</div>
        <button id="ionClose" class="panelClose" type="button" aria-label="Close">×</button>
      </div>
      <p class="panelText">Enter your own Cesium Ion access token. The token is used directly by this browser and is never sent to a GEV server.</p>
      <label class="fieldLabel" for="ionToken">ACCESS TOKEN</label>
      <input id="ionToken" class="tokenInput" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Paste Cesium Ion token" />
      <label class="rememberRow">
        <input id="ionRemember" type="checkbox" checked />
        <span>Remember on this device</span>
      </label>
      <div class="panelActions">
        <button id="ionConnect" type="button">CONNECT</button>
        <button id="ionClear" type="button">CLEAR</button>
      </div>
      <div id="ionState" class="panelState" role="status">NO USER TOKEN CONFIGURED</div>
    </section>
  </div>
  <script type="module" src="/src/web-core/main.js"></script>
</body>
</html>
